# Genera la narración con edge-tts y exporta el video ¿Adiós, dinosaurios? con voz.
# El MP4 final se guarda en la rama (video-dinosaurios/out/adios-dinosaurios.mp4)
# y también queda como artefacto descargable de la ejecución.
name: Video ¿Adiós, dinosaurios?

on:
  push:
    branches: [ccr-9d31af9c-xtkjzx]
    paths:
      - 'video-dinosaurios/src/**'
      - 'video-dinosaurios/scripts/**'
      - 'video-dinosaurios/public/fonts/**'
      - 'video-dinosaurios/package*.json'
      - 'video-dinosaurios/remotion.config.ts'
      - '.github/workflows/video-dinosaurios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-dinosaurios
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-dinosaurios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2
          pip install edge-tts numpy
          npm ci
      - name: Narración (edge-tts, es-CO-SalomeNeural)
        run: npm run voz
      - name: Música y efectos
        run: npm run musica
      - name: Exportar MP4
        run: npm run render
      - name: Revisar el video
        run: ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration -of compact out/adios-dinosaurios.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: adios-dinosaurios
          path: video-dinosaurios/out/adios-dinosaurios.mp4
      - name: Guardar el video en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/adios-dinosaurios.mp4 public/audio/escena-*.mp3 src/narracion.json
          git commit -m "Video final con narración (generado por GitHub Actions)" || exit 0
          git push
